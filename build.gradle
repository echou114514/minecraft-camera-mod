plugins {
    // 使用官方插件，确保 loom_version 在 gradle.properties 中定义且 >= 0.10
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

repositories {
    // Fabric maven for fabric-api/loader artifacts. This loom variant only
    // auto-adds it when `loom_fabric_repository` is set, so declare it here to
    // keep the build self-contained on machines without mirror properties.
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
        content {
            includeGroup("net.fabricmc")
            includeGroup("net.fabricmc.fabric-api")
        }
    }
    // Fallback for the dev-client mods when dev-mods/ has no local copy.
    // Loom 会自动添加其余的 Maven 仓库。
    maven { url = "https://api.modrinth.com/maven" }
    maven {
        name = "GeckoLib"
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
        content {
            includeGroup("software.bernie.geckolib")
        }
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/releases/"
        content {
            includeGroup("com.terraformersmc")
        }
    }
}

def devModsCache = file("dev-mods")

// ---------------------------------------------------------------------------
// Automatic versioning. gradle.properties only pins `mod_version_base`; the
// real version is derived from git:
//   - tag build (v1.2.0)          -> 1.2.0
//   - ordinary commit             -> <base>-dev.<commitCount>+<shortHash>
//   - no git available            -> <base>
// ---------------------------------------------------------------------------
def derivedVersion = providers.gradleProperty("mod_version_base").orElse("0.0.0").get()
try {
    def refType = System.getenv("GITHUB_REF_TYPE")
    def refName = System.getenv("GITHUB_REF_NAME")
    if (refType == "tag" && refName != null && refName.startsWith("v")) {
        derivedVersion = refName.substring(1)
    } else {
        def commitCount = providers.exec {
            commandLine("git", "rev-list", "--count", "HEAD")
        }.standardOutput.asText.get().trim()
        def commitHash = providers.exec {
            commandLine("git", "rev-parse", "--short", "HEAD")
        }.standardOutput.asText.get().trim()
        derivedVersion = "${derivedVersion}-dev.${commitCount}+${commitHash}"
    }
} catch (Exception ignored) {
    // Not a git checkout (zip download, git missing, shallow CI clone) — keep base.
}
version = derivedVersion

tasks.register("printVersion") {
    description = "Prints the derived mod version (used by CI release workflows)."
    doLast {
        println project.version
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "camera-mod" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // 3D camera model + first-person assembly/shutter animations.
    modImplementation "software.bernie.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"

    // Compile-only: the Mod Menu entrypoint is only loaded when Mod Menu is
    // present, so the published jar ships the class without the dependency.
    modCompileOnly "com.terraformersmc:modmenu:11.0.3"

    // Test-only runtime mods for `gradlew runClient`; they never reach the
    // published jar.
    //
    // OFF by default: Iris' refmap is keyed by Mojang names while this project
    // maps with yarn, so Loom's dev remapper NPEs on Iris' descriptor-less
    // @ModifyArg annotations (see TODO.md). Enable with `-PwithIrisDev` only
    // when actively debugging the shader integration; otherwise validate
    // shaders in a real modpack via scripts/runModpack.sh.
    //
    // Loom has to remap these jars (including Iris' mixin refmap), so they
    // cannot simply be dropped into run/mods. A local copy in dev-mods/ avoids
    // the slow Modrinth download.
    // `-PwithIrisDev`（无值=空串）或 `-PwithIrisDev=true` 均可开启。
    def irisDevFlag = providers.gradleProperty("withIrisDev").orNull
    if (irisDevFlag == "true" || irisDevFlag == "") {
        [
            ["iris-fabric-1.8.8+mc1.21.1.jar",
             "maven.modrinth:iris:${project.dev_iris_version}"],
            ["sodium-fabric-0.6.9+mc1.21.1.jar",
             "maven.modrinth:sodium:${project.dev_sodium_version}"],
            ["DistantHorizons-3.3.3-1.21.1-fabric-neoforge.jar",
             "maven.modrinth:distanthorizons:${project.dev_dh_version}"],
            // Iris 的 JiJ 库依赖：Loom 不展开 files() 依赖的内嵌 jar，需手动带上。
            // fabric-api-* 的内嵌模块由完整 fabric-api 覆盖，不用带。
            ["antlr4-runtime-4.13.1.jar", null],
            ["glsl-transformer-2.0.1.jar", null],
            ["jcpp-1.4.14.jar", null],
        ].each { name, coordinate ->
            def cached = new File(devModsCache, name)
            if (cached.exists()) {
                modRuntimeOnly files(cached)
            } else if (coordinate != null) {
                modRuntimeOnly coordinate
            } else {
                throw new GradleException(
                    "dev-mods/${name} missing — extract it from the Iris jar's META-INF/jars")
            }
        }
    }
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    def projectName = project.name
    inputs.property "projectName", projectName

    from("LICENSE") {
        rename { "${it}_$projectName" }
    }
}

loom {
    runs {
        client {
            programArgs "--username", "Dev"
            vmArg "-Xmx6G"
            vmArg "-Xms6G"
            // HDR 目标由 AUTO 自动检测（解析光影包 final 程序的 colortex 采样），
            // Complementary=colortex3 / Eclipse=colortex5 均覆盖；需要手动时用
            // -Dcameramod.irisHdrTarget=N 覆盖。
            // Unattended test harness: `./gradlew runClient -PautoTest=true
            // -PautoTestExports=2` creates/reuses a test world and captures
            // everything automatically.
            if (providers.gradleProperty("autoTest").orNull != null) {
                vmArg "-Dcameramod.autoTest=${providers.gradleProperty('autoTest').get()}"
                vmArg "-Dcameramod.autoTest.exports=${providers.gradleProperty('autoTestExports').orElse('6').get()}"
            }
        }
    }
}

// ---------------------------------------------------------------------------
// Dev-client test environment. The runtime mods are declared in `dependencies`
// (Loom has to remap them); this task only stages the shader pack and seeds
// Iris so `runClient` starts directly with the right pack.
// `run/` and `dev-mods/` are gitignored.
// ---------------------------------------------------------------------------
def devShaderpackName = "ComplementaryReimagined_r5.9.3.zip"
def devShaderpackUrl = project.dev_shaderpack_url

tasks.register("prepareDevRun") {
    description = "Stages the test shader pack and preselects it for `runClient`."
    outputs.file(file("run/shaderpacks/${devShaderpackName}"))
    outputs.file(file("run/config/iris.properties"))

    doLast {
        def pack = file("run/shaderpacks/${devShaderpackName}")
        if (!pack.exists()) {
            pack.parentFile.mkdirs()
            def cached = new File(devModsCache, devShaderpackName)
            if (cached.exists()) {
                logger.lifecycle("Using cached ${devShaderpackName}")
                java.nio.file.Files.copy(cached.toPath(), pack.toPath())
            } else {
                logger.lifecycle("Downloading ${devShaderpackName} ...")
                URI.create(devShaderpackUrl).toURL().withInputStream { input ->
                    pack.withOutputStream { output -> output << input }
                }
            }
        }

        // Only seed the config on first run so in-game shader choices survive.
        def irisConfig = file("run/config/iris.properties")
        if (!irisConfig.exists()) {
            irisConfig.parentFile.mkdirs()
            irisConfig.text = """# Generated by prepareDevRun; delete this file to reseed.
enableShaders=true
shaderPack=${devShaderpackName}
"""
        }
    }
}

tasks.matching { it.name == "runClient" }.configureEach {
    dependsOn "prepareDevRun"
}
