# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.19.5
# Pinned, not SNAPSHOT: builds must stay reproducible.
loom_version=1.17.21

# Mod Properties
# 实际版本号由 build.gradle 从 git 推导：tag 构建用 tag（去 v 前缀），
# 普通提交用 <base>-dev.<提交数>+<短哈希>。此处只定义基础版本。
mod_version_base=1.2.0
group=com.example.camera

# Dependencies
fabric_api_version=0.116.17+1.21.1
geckolib_version=4.8.4

# Optional dev-only runtime mods (-PwithIrisDev); never enter the published jar.
# 已知兼容组合（Modrinth 实测存在）：Iris 1.8.8 / Sodium 0.6.9 / DH 2.3.0-b-1.21.1 及以上
# （1.21.1 线上 DH 从 3.0.2-b 起，故用 3.3.3）。
dev_iris_version=1.8.8+1.21.1-fabric
dev_sodium_version=mc1.21.1-0.6.9-fabric
dev_dh_version=3.3.3-1.21.1
dev_shaderpack_url=https://cdn.modrinth.com/data/HVnmMxH1/versions/Bqen1mJX/ComplementaryReimagined_r5.9.3.zip

# 中国镜像默认关闭。需要时运行 `scripts/enable-cn-mirrors.sh`，它会把这些
# 属性写进 ~/.gradle/gradle.properties（Gradle 用户级属性对本项目全局生效，
# 仓库文件保持官方源，海外用户与 CI 不受影响）。
